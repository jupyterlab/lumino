# This workflow fails in PRs with changes to the review/api directory

name: 'Does PR have API changes?'
on:
  pull_request:

jobs:
  api-changes:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '16.x'
      CACHE_PREFIX: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache yarn
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - name: Cache yarn
        uses: actions/cache@v6
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ env.CACHE_PREFIX }}-yarn-${{ env.NODE_VERSION }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-yarn-${{ env.NODE_VERSION }}

      - name: Run api-extractor
        shell: bash
        run: |
          set -ex
          yarn
          yarn build
          yarn api

      - name: Fail if the API reports changed
        shell: bash
        run: |
          changed=$(git status --porcelain -- review/api)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::The API reports in review/api are out of date. Run 'yarn build && yarn api' and commit the changes."
            exit 1
          fi
